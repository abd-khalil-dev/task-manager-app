<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            background-color: #f4f4f9;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .task {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-info h3 {
            margin: 0 0 5px 0;
        }
        .delete-btn {
            background-color: #f44336;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 4px;
            width: auto;
        }
    </style>
</head>
<body>
    <h1>📋 Task Manager</h1>

    <form action="/add" method="POST">
        <input type="text" name="title" placeholder="Task Title" required>
        <textarea name="description" placeholder="Task Description"></textarea>
        <button type="submit">Add Task</button>
    </form>

    {% for task in tasks %}
    <div class="task">
        <div class="task-info">
            <h3>{{ task[1] }}</h3>
            <p>{{ task[2] }}</p>
        </div>
        <a href="/delete/{{ task[0] }}" class="delete-btn">Delete</a>
    </div>
    {% else %}
    <p style="text-align: center; color: #888;">No tasks yet. Add one above!</p>
    {% endfor %}
</body>
</html>
